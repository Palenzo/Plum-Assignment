[project]
name = "opd-adjudication"
version = "0.1.0"
description = "OPD claim adjudication engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "agno>=2.6",
    "groq>=0.11",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.10",
    "pillow>=10.0",
    "pymupdf>=1.24",
    "temporalio>=1.28",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
