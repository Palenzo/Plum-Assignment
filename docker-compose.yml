# One-command stack:  docker compose up --build
# Put your key in a .env file next to this file:  GROQ_API_KEY=gsk_...
#
# This runs the app in in-process mode (no separate worker) so it starts with a
# single command. To run the durable Temporal pipeline instead, start a Temporal
# server + the worker (see the README "Durable mode" section) and set
# TEMPORAL_ENABLED=true with TEMPORAL_TARGET pointing at it.

name: plum-opd

services:
  backend:
    build: ./backend
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - TEMPORAL_ENABLED=false
      - DATABASE_URL=sqlite:////data/claims.db
    volumes:
      - claims:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      # The Next.js server proxies /api/* here (service-to-service on the compose network).
      - BACKEND_URL=http://backend:8000
    ports:
      - "3000:3000"

volumes:
  claims:
