# Render Blueprint — deploys the whole OPD app (backend + frontend) from one repo.
#
# Deploy:  Render Dashboard → New → Blueprint → pick this repo → Apply.
# Then set the one secret it asks for: GROQ_API_KEY (https://console.groq.com/keys).
#
# Both services run from the existing Dockerfiles, so production gets the full
# stack including Tesseract OCR. Temporal is off (the app falls back to the same
# pipeline in-process), and the database is ephemeral SQLite — perfect for a demo.
services:
  # ---- Backend: FastAPI + rule engine + Agno/Groq ----
  - type: web
    name: plum-opd-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore          # closest free region to India
    healthCheckPath: /health
    envVars:
      # Logging mode. Production = INFO. To debug, set LOG_LEVEL=DEBUG in the
      # dashboard (or flip APP_ENV to development) for verbose request logs.
      - key: APP_ENV
        value: production
      # LLM provider: set OPENAI_API_KEY to use OpenAI, or GROQ_API_KEY for Groq
      # (auto-detected — OpenAI wins if both are present).
      - key: OPENAI_API_KEY     # secret — set in the dashboard when prompted
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: GROQ_API_KEY       # optional fallback — leave blank if using OpenAI
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: TEMPORAL_ENABLED   # in-process fallback; no Temporal server in the cloud
        value: "false"
      - key: AI_REVIEW_ENABLED
        value: "true"
      - key: ADMIN_TOKEN       # password for the /admin policy editor — set your own
        sync: false

  # ---- Frontend: Next.js ----
  - type: web
    name: plum-opd-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    region: singapore
    envVars:
      # Read at runtime by the API proxy (no CORS, no build-time baking).
      # Explicit full URL: `fromService property: host` returns a bare hostname
      # that resolves to an unreachable internal address, which surfaced as 502s.
      # NOTE: Render appended a random suffix to the service ("-xfjn"), so the
      # real host is plum-opd-backend-xfjn, not plum-opd-backend.
      - key: BACKEND_URL
        value: https://plum-opd-backend-xfjn.onrender.com
      # Logging mode. Production keeps [proxy] logs quiet; to debug a deploy set
      # PROXY_DEBUG=true in the dashboard for verbose per-request proxy logs.
      - key: APP_ENV
        value: production
