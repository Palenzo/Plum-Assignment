# Durable mode — adds a Temporal server + worker so every claim runs as a
# durable, retryable workflow (visible in the Temporal UI).
#
#   docker compose -f docker-compose.yml -f docker-compose.temporal.yml up --build
#
# Temporal UI: http://localhost:8233   ·   App: http://localhost:3000

services:
  temporal-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-pg:/var/lib/postgresql/data

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      - temporal-postgres
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=temporal-postgres
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.31.2
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8233:8080"

  worker:
    build: ./backend
    command: python -m app.temporal.worker
    restart: on-failure
    depends_on:
      - temporal
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - TEMPORAL_TARGET=temporal:7233
      - DATABASE_URL=sqlite:////data/claims.db
    volumes:
      - claims:/data

  backend:
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - TEMPORAL_ENABLED=true
      - TEMPORAL_TARGET=temporal:7233
      - DATABASE_URL=sqlite:////data/claims.db
    depends_on:
      - temporal

volumes:
  temporal-pg:
